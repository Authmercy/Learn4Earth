name: Initial ECR Setup

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: react-frontend

jobs:
  ecr-init:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push initial Docker image
        working-directory: ./app
        run: |
          ECR_REGISTRY=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --query 'repositories[0].repositoryUri' --output text | cut -d'/' -f1)
          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:initial

          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
          # Also tag as latest for first deployment
          docker tag $IMAGE_URI ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest